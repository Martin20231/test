<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#064E4A" />
    <title>Relay — Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <section id="auth-screen" class="auth-screen">
      <div class="auth-panel">
        <header class="auth-brand">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-wave"></span>
          </div>
          <h1 class="brand-name">Relay</h1>
          <p class="brand-tagline">Dein Messenger. Sofort. Ohne Schnickschnack.</p>
        </header>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab is-active" data-tab="login" role="tab">
            Anmelden
          </button>
          <button type="button" class="auth-tab" data-tab="register" role="tab">
            Registrieren
          </button>
        </div>

        <form id="login-form" class="auth-form" autocomplete="on">
          <label>
            <span>Benutzername</span>
            <input name="username" required minlength="3" maxlength="24" placeholder="anna" />
          </label>
          <label>
            <span>Passwort</span>
            <input name="password" type="password" required minlength="4" placeholder="demo" />
          </label>
          <button type="submit" class="btn btn-primary">Rein gehen</button>
        </form>

        <form id="register-form" class="auth-form is-hidden" autocomplete="on">
          <label>
            <span>Benutzername</span>
            <input name="username" required minlength="3" maxlength="24" placeholder="marie" />
          </label>
          <label>
            <span>Anzeigename</span>
            <input name="display_name" required minlength="2" maxlength="40" placeholder="Marie Schmidt" />
          </label>
          <label>
            <span>Passwort</span>
            <input name="password" type="password" required minlength="4" placeholder="mindestens 4 Zeichen" />
          </label>
          <button type="submit" class="btn btn-primary">Konto erstellen</button>
        </form>

        <p id="auth-error" class="auth-error" hidden></p>

        <aside class="demo-hint">
          <strong>Demo-Accounts</strong>
          <span>anna / ben / clara / david — Passwort: <code>demo</code></span>
          <span>Tipp: Zwei Browserfenster öffnen und live chatten.</span>
        </aside>
      </div>
    </section>

    <main id="app-screen" class="app-screen is-hidden">
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="me-block">
            <div id="me-avatar" class="avatar" aria-hidden="true"></div>
            <div class="me-text">
              <div class="brand-inline">Relay</div>
              <div id="me-name" class="me-name"></div>
            </div>
          </div>
          <div class="sidebar-actions">
            <button type="button" id="btn-new-chat" class="icon-btn" title="Neuer Chat" aria-label="Neuer Chat">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
            <button type="button" id="btn-logout" class="icon-btn" title="Abmelden" aria-label="Abmelden">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </button>
          </div>
        </header>

        <div class="search-wrap">
          <input id="chat-search" type="search" placeholder="Chats durchsuchen" />
        </div>

        <div id="conversation-list" class="conversation-list" role="list"></div>
      </aside>

      <section class="chat-pane" id="chat-pane">
        <div id="empty-state" class="empty-state">
          <div class="empty-orb" aria-hidden="true"></div>
          <h2>Wähle einen Chat</h2>
          <p>Oder starte eine neue Unterhaltung mit jemandem aus deiner Kontaktliste.</p>
          <button type="button" id="btn-empty-new" class="btn btn-secondary">Neuen Chat starten</button>
        </div>

        <div id="active-chat" class="active-chat is-hidden">
          <header class="chat-header">
            <button type="button" id="btn-back" class="icon-btn back-btn" aria-label="Zurück">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <div id="peer-avatar" class="avatar" aria-hidden="true"></div>
            <div class="chat-header-text">
              <div id="peer-name" class="peer-name"></div>
              <div id="peer-meta" class="peer-meta"></div>
            </div>
          </header>

          <div id="message-list" class="message-list" aria-live="polite"></div>

          <div id="typing-indicator" class="typing-indicator is-hidden">
            <span></span><span></span><span></span>
          </div>

          <form id="composer" class="composer">
            <input
              id="message-input"
              type="text"
              maxlength="2000"
              placeholder="Nachricht schreiben…"
              autocomplete="off"
            />
            <button type="submit" class="send-btn" aria-label="Senden">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>

    <dialog id="new-chat-dialog" class="sheet">
      <form method="dialog" id="new-chat-form" class="sheet-inner">
        <header class="sheet-header">
          <h2>Neuer Chat</h2>
          <button type="submit" value="cancel" class="icon-btn" aria-label="Schließen">×</button>
        </header>
        <div id="contact-list" class="contact-list"></div>
      </form>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
