<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relay Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Syne:wght@800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --brand: #064e4a;
        --soft: #0f766e;
        --bg: #dceee8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Figtree, sans-serif;
        color: #12201e;
        background:
          radial-gradient(900px 500px at 10% 0%, rgba(15, 118, 110, 0.25), transparent 55%),
          linear-gradient(160deg, #b9ddd3, var(--bg) 50%, #e7f3ee);
        padding: 24px;
      }
      main {
        width: min(480px, 100%);
        background: rgba(247, 251, 249, 0.9);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 28px;
        padding: 32px 28px;
        box-shadow: 0 18px 50px rgba(4, 56, 52, 0.14);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: Syne, sans-serif;
        font-size: 3rem;
        letter-spacing: -0.04em;
        color: var(--brand);
      }
      p { color: #3d524e; line-height: 1.5; }
      code {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 14px;
        border-radius: 12px;
        background: #eef6f2;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Relay</h1>
      <p>Dein Messenger braucht einen Node-Server (Echtzeit-Chat).</p>
      <p>Lokal starten:</p>
      <code>npm install && npm start</code>
      <p style="margin-top:18px;font-size:0.92rem;">Dann öffnen: <strong>http://localhost:3000</strong></p>
    </main>
  </body>
</html>
